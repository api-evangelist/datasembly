aid: datasembly
name: Datasembly
description: >-
  Datasembly is a real-time retail intelligence platform that collects hyperlocal
  pricing, promotion, and assortment data from physical and online retail
  locations. The company reports gathering 12+ billion weekly prices across 150K+
  stores from 230+ retailers, building a dataset of more than 2 trillion
  observations that consumer packaged goods (CPG) brands and retailers use to
  optimize pricing strategy, measure trade-spend effectiveness, monitor
  competitors, evaluate key value items, and plan seasonal launches. Datasembly
  delivers this competitive intelligence as fully shareable data and analytics
  rather than a public developer API. The company was acquired by SPINS. This
  profile was surfaced as a portfolio company of 500 Global and enriched by the
  API Evangelist pipeline; no public API, developer portal, or API documentation
  was found on the provider's surface at the time of enrichment.
